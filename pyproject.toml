[project]
name = "workua-contact-enrichment"
version = "0.1.0"
description = "MVP for enriching company contacts from Work.ua and company websites"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "pydantic>=2.9.2",
  "python-dotenv>=1.1.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.services", "app.public"]
include-package-data = true

[tool.setuptools.package-data]
app = ["public/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
